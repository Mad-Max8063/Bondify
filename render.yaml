services:
  - type: web
    name: bondify
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # PORT no se setea: Render lo inyecta y server.js ya lo lee.
      - key: NODE_ENV
        value: production
      - key: VITE_BACKEND_URL
        value: ""
      # Secreto de las cookies de sesión anónima (bfy_uid). Render lo genera.
      - key: SESSION_SECRET
        generateValue: true
      # Pegar en el dashboard: JSON completo del service account de
      # bondify-app-db73f (Project settings → Service accounts).
      - key: FIREBASE_CREDENTIALS
        sync: false
      # Pegar en el dashboard: key de Google AI Studio (aistudio.google.com/apikey).
      - key: GEMINI_API_KEY
        sync: false
      # Actualizar con la URL final del servicio una vez creado.
      - key: CORS_ORIGINS
        value: https://bondify.onrender.com
